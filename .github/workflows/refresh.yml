name: Refresh bundles.txt

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC (11:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Scrape bundle repo URLs
        run: python3 scrape-bundle-repos.py bundles.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bundles.txt
          if git diff --cached --quiet; then
            echo "bundles.txt unchanged"
          else
            git commit -m "Refresh bundles.txt"
            git push
          fi
